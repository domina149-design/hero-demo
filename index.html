<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>HERO Belegungsmanagement</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#813695">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HERO Belegung">
<meta name="author" content="Khaled Al Aodit Allah">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>

:root{
  --bg:#F6F3F8; --surface:#FFFFFF; --surface-2:#F1E7F5; --line:#E4DEEA; --line-2:#D6CDDD;
  --fg:#1F1A24; --fg-2:#4F4757; --muted:#6B6475;
  --accent:#813695; --accent-strong:#5E2470; --on-accent:#FFFFFF;
  --ok:#1E6B3F; --ok-bg:#E3F3EA; --warn:#8A4608; --warn-bg:#FCEBD9;
  --bad:#B42318; --bad-bg:#FDE7E5; --info:#1F4F8A; --info-bg:#E2ECF8; --neutral-bg:#ECE9EE; --neutral:#3D3546;
  --scrim:rgba(31,26,36,.45);
  --font:'Source Sans 3', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17131B; --surface:#211B26; --surface-2:#33233D; --line:#342C3B; --line-2:#463C4E;
  --fg:#F2EEF5; --fg-2:#CFC6D6; --muted:#A79DB0;
  --accent:#C48BDA; --accent-strong:#E0BFEC; --on-accent:#1C0F22;
  --ok:#7FD3A2; --ok-bg:#163526; --warn:#F2B47A; --warn-bg:#3A2614;
  --bad:#FF9C90; --bad-bg:#3E1C19; --info:#9CC3F5; --info-bg:#182A40; --neutral-bg:#2C2531; --neutral:#D8D0DE;
  --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17131B; --surface:#211B26; --surface-2:#33233D; --line:#342C3B; --line-2:#463C4E;
  --fg:#F2EEF5; --fg-2:#CFC6D6; --muted:#A79DB0;
  --accent:#C48BDA; --accent-strong:#E0BFEC; --on-accent:#1C0F22;
  --ok:#7FD3A2; --ok-bg:#163526; --warn:#F2B47A; --warn-bg:#3A2614;
  --bad:#FF9C90; --bad-bg:#3E1C19; --info:#9CC3F5; --info-bg:#182A40; --neutral-bg:#2C2531; --neutral:#D8D0DE;
  --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo-light{display:none} :root:not([data-theme="light"]) .logo-dark{display:block} }
:root[data-theme="dark"] .logo-light{display:none} :root[data-theme="dark"] .logo-dark{display:block}

/* Login */
.login{min-height:100%;display:flex;flex-wrap:wrap}
.login-hero{flex:1 1 420px;background:var(--accent);color:var(--on-accent);padding-block:48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.login-hero .eyebrow{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;opacity:.9}
.login-hero h1{font-size:clamp(30px,4vw,48px);line-height:1.1;font-weight:800;max-width:16ch}
.login-hero p{margin:0;font-size:18px;max-width:40ch;opacity:.92}
.login-form{flex:1 1 380px;display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface)}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.login-box img{width:240px;height:auto}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--fg);color:var(--bg);border:0;border-radius:10px;min-height:52px;font-weight:700;font-size:16px}
.note{font-size:14px;color:var(--muted);margin:0}

/* Shell */
.app{display:flex;min-height:100%}
.side{width:248px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding-left:max(12px,env(safe-area-inset-left,0px))}
.side img{width:180px;height:auto;margin:4px 10px 18px}
.side .site{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 12px 8px}
.nav-a{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:600}
.nav-a svg{flex:none}
.nav-a[aria-current="page"]{background:var(--surface-2);color:var(--accent-strong)}
.nav-a:hover{background:var(--surface-2)}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding:14px 12px 0;display:flex;gap:10px;align-items:center;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.demo-bar{background:var(--surface-2);color:var(--accent-strong);font-size:14px;font-weight:600;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-bar > span:last-child{flex-wrap:wrap}
.demo-bar button{background:transparent;border:1px solid var(--accent);color:var(--accent-strong);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.content{padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1600px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
@media (min-width:900px){ .content{padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))} }
.tabbar{display:none}
@media (max-width:899px){
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .topbar img{height:26px;width:auto}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));z-index:20}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;font-size:11px;font-weight:600;color:var(--fg-2);text-decoration:none;border-radius:8px}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:800}
  .content{padding-bottom:110px}
}

/* Common UI */
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.page-head .sub{font-size:14px;color:var(--muted)}
.page-head h1{font-size:clamp(26px,3vw,32px);font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:700;text-decoration:none;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.soft{background:var(--surface-2);border-color:transparent;color:var(--accent-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;min-height:52px;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ho-count{font-size:20px;margin:0}.ho-count b{font-size:34px;font-weight:800;margin-right:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:14px;color:var(--muted)}
.kpi .v{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:14px;font-weight:600}
.kpi.alert{border-color:var(--bad)}
.kpi.alert .v,.kpi.alert .s{color:var(--bad)}
.grid-h{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.house{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--fg)}
.house:hover{border-color:var(--accent)}
.house .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.house .n{font-size:22px;font-weight:800}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-Belegt{background:var(--surface-2);color:var(--accent-strong)}
.st-Frei{background:var(--ok-bg);color:var(--ok)}
.st-Reinigen{background:color-mix(in srgb,var(--accent) 24%,var(--surface));color:var(--accent-strong)}
.st-Reserviert{background:var(--info-bg);color:var(--info)}
.st-Nicht{background:var(--neutral-bg);color:var(--neutral);white-space:nowrap}
.rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:8px}
.rm-cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line-2);background:var(--surface);color:inherit;border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;min-height:64px}
.rm-cell b{font-size:16px}.rm-cell span{font-size:13px;color:var(--muted)}.rm-cell .pill{font-size:11px}
.rm-cell:hover{border-color:var(--accent)}.rm-cell.locked{background:var(--surface-2)}
.rm-acts{display:flex;gap:8px;flex-wrap:wrap}
.rm-box{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px}
.danger-zone{border-color:var(--bad)}
.radio{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}.radio input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.warnbox{background:var(--surface-2);border-radius:8px;padding:10px}
.st-Gesperrt{background:var(--bad-bg);color:var(--bad)}.st-Lager{background:var(--warn-bg);color:var(--warn)}
/* Zeilenfarbe nach Zimmerstatus */
:root{--rs-Frei:color-mix(in srgb,var(--ok-bg) 70%,var(--surface));--rs-Reinigen:color-mix(in srgb,var(--accent) 11%,var(--surface));--rs-Gesperrt:color-mix(in srgb,var(--bad-bg) 75%,var(--surface));--rs-Reserviert:color-mix(in srgb,var(--info-bg) 75%,var(--surface));--rs-Nicht:var(--neutral-bg);--rs-Lager:color-mix(in srgb,var(--warn-bg) 70%,var(--surface))}
tr.rs-Frei td{background:var(--rs-Frei)}tr.rs-Reinigen td{background:var(--rs-Reinigen)}tr.rs-Gesperrt td{background:var(--rs-Gesperrt)}tr.rs-Reserviert td{background:var(--rs-Reserviert)}tr.rs-Nicht td{background:var(--rs-Nicht)}tr.rs-Lager td{background:var(--rs-Lager)}
tr.rs-Frei td:first-child{box-shadow:inset 4px 0 0 var(--ok)}tr.rs-Reinigen td:first-child{box-shadow:inset 4px 0 0 var(--accent)}tr.rs-Gesperrt td:first-child{box-shadow:inset 4px 0 0 var(--bad)}tr.rs-Reserviert td:first-child{box-shadow:inset 4px 0 0 var(--info)}tr.rs-Nicht td:first-child{box-shadow:inset 4px 0 0 var(--neutral)}tr.rs-Lager td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.bedcard.rs-Frei{background:var(--rs-Frei);border-left:4px solid var(--ok)}.bedcard.rs-Reinigen{background:var(--rs-Reinigen);border-left:4px solid var(--accent)}.bedcard.rs-Gesperrt{background:var(--rs-Gesperrt);border-left:4px solid var(--bad)}.bedcard.rs-Reserviert{background:var(--rs-Reserviert);border-left:4px solid var(--info)}.bedcard.rs-Nicht{background:var(--rs-Nicht);border-left:4px solid var(--neutral)}.bedcard.rs-Lager{background:var(--rs-Lager);border-left:4px solid var(--warn)}
.st-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--fg-2)}.st-legend span{display:flex;align-items:center;gap:6px}.st-legend i{width:14px;height:14px;border-radius:4px;border-left:4px solid var(--c);background:var(--b)}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)} .bad{background:var(--bad-bg);color:var(--bad)} .info{background:var(--info-bg);color:var(--info)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.panel{padding:18px;display:flex;flex-direction:column;gap:4px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.panel-h h2{font-size:18px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:700}
.row .d{font-size:13px;color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:inherit;text-align:left;font-weight:700;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.alertchip{color:var(--bad);border-color:var(--bad)}
.chip.alertchip[aria-pressed="true"]{background:var(--bad);color:var(--surface)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;min-height:44px;flex:1 1 240px}
.search input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:16px}
select,input[type=text],input[type=date],textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;min-height:44px;padding:0 10px;font-size:16px}
textarea{padding:10px;min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px;font-weight:700}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.num{font-variant-numeric:tabular-nums}
tr.alert-row{background:var(--bad-bg)}
/* Datentabellen: feine, kurze Trennstriche zwischen den Spalten und Gruppen je Zimmer */
.card.table-wrap td,.card.table-wrap th{position:relative}
.card.table-wrap td+td::before,.card.table-wrap th+th::before{content:"";position:absolute;left:0;top:30%;bottom:30%;width:2px;border-radius:2px;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--accent) 38%,transparent) 30%,color-mix(in srgb,var(--accent) 38%,transparent) 70%,transparent)}
.card.table-wrap thead th{background:var(--surface-2);color:var(--accent-strong)}
.card.table-wrap thead th:first-child{border-top-left-radius:12px}.card.table-wrap thead th:last-child{border-top-right-radius:12px}
.card.table-wrap tbody tr:hover td{filter:brightness(.98)}.card.table-wrap tbody tr:not([class*=rs-]):not(.alert-row):hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.card.table-wrap tbody tr.alert-row:hover{background:var(--bad-bg)}
.card.table-wrap tr.same-room td{border-top:1px dashed color-mix(in srgb,var(--line-2) 80%,transparent)}
.card.table-wrap tr.room-start td{border-top:2px solid color-mix(in srgb,var(--accent) 22%,var(--line))}
.card.table-wrap tbody tr:first-child td{border-top:0}
.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.actions .btn{min-height:38px;padding:0 12px;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* bed cards on narrow screens */
.bedcards{display:none;flex-direction:column;gap:8px}
@media (max-width:699px){ .table-wrap.beds{display:none} .bedcards{display:flex} }
.bedcard{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--fg)}
.bedcard.alert{border:2px solid var(--bad)}
.bedcard .room{display:flex;flex-direction:column;gap:4px;width:72px;flex:none}
/* attendance */
.att-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px;padding:0;margin:0;list-style:none}
.att{padding:12px;display:flex;flex-direction:column;gap:10px}
.att.alert{border:2px solid var(--bad)}
.att .head{display:flex;gap:10px;align-items:flex-start}
.roomtag{font-size:14px;font-weight:800;background:var(--surface-2);color:var(--accent-strong);border-radius:6px;padding:3px 8px;flex:none}
.att .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:46px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:15px}
.att .seg{grid-template-columns:1fr 1fr 56px}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.seg button svg{width:26px;height:26px}
.seg button.a{color:var(--ok);border:2px solid var(--ok)}
.seg button.b{color:var(--bad);border:2px solid var(--bad)}
.seg button.c{color:var(--muted)}
.att.m-a{border-color:var(--ok);background:var(--ok-bg)}
.att.m-b{border-color:var(--bad);background:var(--bad-bg)}
.att.m-c{border-color:var(--warn);background:var(--warn-bg)}
.mk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;flex:none}
.mk svg{width:16px;height:16px}
.mk.a{background:var(--ok);color:var(--surface)} .mk.b{background:var(--bad);color:var(--surface)} .mk.c{background:var(--warn);color:var(--surface)} .mk.n{background:transparent;border:2px dashed var(--line-2);color:var(--muted)}
.pres{display:inline-flex;align-items:center;gap:10px}
.qk-wrap{display:inline-flex;gap:6px;flex:none}
.qk{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);padding:0}
.qk.a{border:2px solid var(--ok);color:var(--ok)} .qk.b{border:2px solid var(--bad);color:var(--bad)}
.qk.a[aria-pressed="true"]{background:var(--ok);color:var(--surface)} .qk.b[aria-pressed="true"]{background:var(--bad);color:var(--surface)}
.bc-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.bedcard.m-a{border-color:var(--ok);background:var(--ok-bg)} .bedcard.m-b{border-color:var(--bad);background:var(--bad-bg)}
.seg button[aria-pressed="true"].a{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.seg button[aria-pressed="true"].b{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.seg button[aria-pressed="true"].c{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.progress{display:flex;flex-direction:column;gap:6px}
.progress .bar{height:10px}
.sticky-foot{position:sticky;bottom:0;background:var(--bg);padding-top:10px;padding-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line)}
@media (max-width:899px){ .sticky-foot{bottom:calc(64px + env(safe-area-inset-bottom,0px))} }
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:699px){ .scrim{align-items:flex-end;padding:0} .sheet{border-radius:18px 18px 0 0;max-width:none;max-height:88%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))} }
.sheet > *{flex-shrink:0}
.sheet-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet-h h2{font-size:21px}
.x{width:44px;height:44px;border:0;background:transparent;color:var(--muted);flex:none}
.bedpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bedpick button{min-height:48px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:700}
.bedpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{font-size:14px;color:var(--muted);margin:0}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:15px}
.okmsg{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:15px;font-weight:600}
/* akte */
.akte-head{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.akte-head .big{width:60px;height:60px;font-size:22px}
.facts .row{justify-content:space-between}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.days i{display:block;height:26px;border-radius:4px}
.d-a{background:var(--ok)} .d-b{background:var(--bad)} .d-c{background:var(--warn)} .d-n{background:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px}
.timeline .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:var(--accent)}
.timeline .ln{display:flex;flex-direction:column;align-items:center}
.timeline .ln::after{content:"";flex:1;width:2px;background:var(--line);min-height:18px}
.timeline .tx{padding-bottom:14px;display:flex;flex-direction:column}
.timeline .ty{font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--accent-strong)}
/* technik */
.photo-prev{width:100%;max-width:240px;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:700;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (max-width:899px){ .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))} }
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}} }
.campsel select{width:100%;min-height:40px;font-weight:700}

.vb.today i{background:var(--accent-strong)}
.vlab{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

.ho-text{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.ho-date{font-size:14px;font-weight:600;opacity:.85}

.ho-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ho-btn{background:var(--surface);color:var(--accent-strong);border-color:transparent}

.hs{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px 11px;display:flex;flex-direction:column;gap:2px}

.hc-bar i{display:block;height:100%}
.hc-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;font-weight:700}

.hc-foot .mk svg{width:12px;height:12px}
.inc-box .search{flex:none}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}

.inc-box{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px}

.inc-row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit}
.doc-table th{width:38%;color:var(--muted);font-size:13px;text-transform:none;letter-spacing:0;vertical-align:top}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.anon{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:15px}

function render(){

  ensureArea();
  const v=UI.view;
  const navLinks=NAV.map(([id,l,ic])=>`<a class="nav-a" href="#${id}" ${(v===id||(v==='akte'&&id==='belegung'))?'aria-current="page"':''}>${ic}${l}</a>`).join('');

  const tabs=TABS.map(([id,l,ic])=>`<a href="#${id}" ${(v===id||(v==='akte'&&id==='belegung'))?'aria-current="page"':''}>${ic}<span>${l}</span></a>`).join('')+`<a href="#mehr" data-act="more" ${inMore?'aria-current="page"':''}>${IC.more}<span>Mehr</span></a>`;
  app.innerHTML=`<div class="app">
   <nav class="side" aria-label="Hauptnavigation">
     <img class="logo-light" src="${LOGO_L}" alt="HERO – Eine neue Zukunft möglich machen"><img class="logo-dark" src="${LOGO_D}" alt="HERO – Eine neue Zukunft möglich machen">
     <div class="site">Einrichtung</div>${campSelect('camp-side')}<div style="height:10px"></div>${navLinks}
     <div class="me"><span class="avatar" aria-hidden="true">KA</span><span><b>${ME.name}</b><br><span style="color:var(--muted)">${ME.role}</span></span></div>
   </nav>
   <div class="main">
     <header class="topbar"><img class="logo-light" src="${LOGO_L}" alt="HERO"><img class="logo-dark" src="${LOGO_D}" alt="HERO">${campSelect('camp-top')}</header>
     <div class="demo-bar"><span>Demo · alle Personen und Zahlen sind erfunden</span><span style="display:flex;gap:8px"><button type="button" data-act="reset">Demo zurücksetzen</button><button type="button" data-act="logout">Abmelden</button></span></div>

function viewHTML(v){
  if(v==='belegung')return belegungView();

  if(v==='akte')return akteView();
  if(v==='berichte')return berichteView();

  if(v==='sachen')return sachenView();
  if(v==='vorfall')return berichteIncView();

  if(v==='protokoll')return protokollView();

}

function stats(a){const bs=a?areaBeds(a):campBeds();const c=s=>bs.filter(b=>b.status===s).length;return{total:bs.length,belegt:c('Belegt'),frei:c('Frei'),rein:c('Reinigen'),gesp:c('Gesperrt')}}
function activePeople(area){const ids=areasCur().map(a=>a.id);return Object.values(S.people).filter(p=>p.active&&(area?bed(p.bed).area===area:ids.includes(bed(p.bed).area)))}
function ensureArea(){const ids=areasCur().map(a=>a.id);const f=ids[0]||'';if(UI.area!=='alle'&&!ids.includes(UI.area))UI.area=f;if(!ids.includes(UI.attArea))UI.attArea=f;if(UI.na.area&&!ids.includes(UI.na.area)){UI.na.area=f;UI.na.bed=null}if(UI.tech&&!ids.includes(UI.tech.area))UI.tech=null}
function campSelect(id){return `<label class="campsel"><span class="sr">Einrichtung</span><select id="${id}">${S.camps.map(c=>`<option value="${c.id}" ${c.id===S.camp?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`}
function ring(pct,size,stroke,col,track,label,sub){const r=(size-stroke)/2,c=2*Math.PI*r,len=Math.max(0,Math.min(1,pct))*c;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(label)} ${Math.round(pct*100)} %"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${len} ${c-len}" transform="rotate(-90 ${size/2} ${size/2})"/>${sub!==undefined?`<text x="50%" y="48%" text-anchor="middle" dominant-baseline="middle" font-size="${size*0.22}" font-weight="800" fill="currentColor">${Math.round(pct*100)}%</text><text x="50%" y="68%" text-anchor="middle" font-size="${size*0.09}" fill="currentColor" opacity=".8">${esc(sub)}</text>`:''}</svg>`}
function spark(vals,col){const v=vals.filter(x=>x!=null);if(v.length<2)return '';const mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;const W=120,H=36;
  const pts=vals.map((x,i)=>x==null?null:[i*(W/(vals.length-1)),H-4-((x-mn)/rg)*(H-10)]).filter(Boolean);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" style="overflow:visible"><path d="${d} L${last[0]} ${H} L0 ${H} Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${col}"/></svg>`}
function greet(){const h=new Date().getHours();return h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend'}
function overviewView(){
  const s=stats(); const occ=s.total?s.belegt/s.total:0;
  const ap=activePeople(); const cnt=k=>ap.filter(p=>S.att[p.qmm]===k).length;
  const A=cnt('a'),B=cnt('b'),C=cnt('c'),done=A+B+C,openN=ap.length-done;
  const absent=ap.filter(p=>daysAway(p)>3).sort((a,b)=>daysAway(b)-daysAway(a));
  const openD=S.defects.filter(d=>d.state!=='erledigt'&&campOf(d.area)===S.camp); const urgent=openD.filter(d=>d.prio==='Dringend');
  const things=(S.things||[]).filter(x=>(x.camp||'c1')===S.camp&&x.state==='eingelagert'&&(Date.now()-x.t)/864e5>FRIST);
  const openAreas=areasCur().filter(a=>{const xp=activePeople(a.id);return xp.length&&xp.some(p=>!S.att[p.qmm])});
  // 7-day series
  const days=[...Array(7)].map((_,i)=>dAgo(6-i));
  const attSeries=days.map((d,i)=>i===6?(done?Math.round((A+C)/done*100):null):(S.camp==='c1'?S.attHist[iso(d)]:null));
  const moveSeries=days.map(d=>{const a=+d,b=a+864e5;return S.log.filter(l=>l.t>=a&&l.t<b&&logCamp(l)===S.camp&&['NEUAUFNAHME','AUSZUG','UMBUCHUNG'].includes(l.type)).length});
  const occSeries=days.map((d,i)=>i===6?Math.round(occ*100):Math.max(0,Math.round(occ*100)+[-3,-2,-2,-1,0,1,0][i]));
  const todo=[
    openAreas.length?{c:'warn',ic:IC.check,t:`Kontrolle offen in ${openAreas.map(a=>a.name).join(', ')}`,d:`${openN} Personen noch nicht erfasst`,href:'#anwesenheit',act:openAreas[0].id}:null,
    absent.length?{c:'bad',ic:IC.check,t:`${absent.length} Personen länger als 3 Tage abwesend`,d:'Klären und dokumentieren',href:'#anwesenheit',f:'lang'}:null,
    urgent.length?{c:'bad',ic:IC.tool,t:`${urgent.length} dringende${urgent.length>1?'':'r'} Mangel`,d:urgent.map(d=>areaName(d.area)+' · '+d.place).join(', '),href:'#technik'}:null,

    s.rein?{c:'info',ic:IC.bed,t:`${s.rein} Betten warten auf Reinigung`,d:'Danach wieder belegbar',href:'#belegung'}:null
  ].filter(Boolean);
  const houses=areasCur().map(a=>{const st=stats(a.id);const xp=activePeople(a.id);const c=k=>xp.filter(p=>S.att[p.qmm]===k).length;const a1=c('a'),b1=c('b'),c1=c('c'),o1=xp.length-a1-b1-c1;const t=xp.length||1;
    const al=xp.filter(p=>daysAway(p)>3).length; const df=openD.filter(d=>d.area===a.id).length;
    return `<button type="button" class="hcard" data-act="goArea" data-area="${a.id}">
      <span class="hc-top"><span class="hc-ring">${ring(st.total?st.belegt/st.total:0,64,7,'var(--accent)','var(--surface-2)','Auslastung')}<b>${st.total?Math.round(st.belegt/st.total*100):0}%</b></span>
        <span class="hc-name"><b>${esc(a.name)}</b><span><b>${xp.length||st.belegt}</b> Bewohner · ${st.belegt} / ${st.total} Betten</span><span>${st.frei} frei · ${st.rein} Reinigung</span></span></span>
      <span class="hc-bar" aria-label="Kontrolle: ${a1} anwesend, ${b1} abwesend, ${o1} offen">${[[a1,'var(--ok)'],[b1,'var(--bad)'],[c1,'var(--warn)'],[o1,'var(--line-2)']].map(([v,col])=>v?`<i style="flex:${v};background:${col}"></i>`:'').join('')}</span>
      <span class="hc-foot"><span class="pres"><span class="mk a">${CK}</span>${a1}</span><span class="pres"><span class="mk b">${XX}</span>${b1}</span><span style="color:var(--muted)">${o1} offen</span>${al?`<span class="pill bad">${al}× &gt;3 T</span>`:''}${df?`<span class="pill warn">${df} Mangel</span>`:''}</span>
    </button>`}).join('');
  const logs=S.log.filter(l=>logCamp(l)===S.camp).sort((a,b)=>b.t-a.t).slice(0,6);
  const dot={BERICHT:'var(--accent-strong)',NEUAUFNAHME:'var(--info)',AUSZUG:'var(--bad)',UMBUCHUNG:'var(--accent)',KONTROLLE:'var(--ok)',MANGEL:'var(--warn)',SACHEN:'var(--warn)'};
  return `
  <section class="hero-ov">
    <div class="ho-text">
      <span class="ho-date">${today.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})} · ${esc(campName(S.camp))}</span>
      <h1>${greet()}, ${esc(ME.name.split(' ')[0])}</h1>
      <p class="ho-count"><b>${ap.length||s.belegt}</b> Bewohner${ap.length?'':' (belegte Betten)'}</p>
      <p>${ap.length?`${done} von ${ap.length} Bewohnern sind heute kontrolliert${absent.length?` · <b>${absent.length} brauchen Aufmerksamkeit</b>`:''}.`:'Die Kontrolle startet, sobald die Bewohnerdaten übernommen sind.'}</p>
      <div class="ho-actions"><a class="btn ho-btn" href="#anwesenheit">${IC.check}Kontrolle starten</a><a class="btn ho-btn ghost" href="#neuaufnahme">${IC.plus}Neuaufnahme</a><a class="btn ho-btn ghost" href="#technik">${IC.tool}Mangel melden</a></div>
    </div>
    <div class="ho-rings">
      <div class="ho-ring">${ring(ap.length?done/ap.length:0,128,12,'#FFFFFF','rgba(255,255,255,.22)','Kontrolle','kontrolliert')}</div>
      <div class="ho-stats">${[['Anwesend',A,'#9BE7C0','#1E6B3F',''],['Abwesend',B,'#FFB0A6','#B42318',''],['Sonstiges',C,'#FFD58A','#8A4608',''],['Offen',openN,'#FFFFFF','#3D3546','open']].map(([l,v,c,cd,k])=>`<div class="hs ${k}" style="--c:${c};--cd:${cd}"><span class="hs-l"><i></i>${l}</span><b>${v}</b><span class="hs-bar"><i style="width:${ap.length?Math.round(v/ap.length*100):0}%"></i></span></div>`).join('')}</div>
    </div>
  </section>

  <section class="kpis">

  <div class="st-legend" style="margin-top:-10px">${[['Frei','var(--ok)','var(--rs-Frei)'],['Belegt','var(--line-2)','var(--surface)'],['Reinigen','var(--accent)','var(--rs-Reinigen)'],['Reserviert','var(--info)','var(--rs-Reserviert)'],['Gesperrt','var(--bad)','var(--rs-Gesperrt)'],['Nicht frei','var(--neutral)','var(--rs-Nicht)'],['Lager','var(--warn)','var(--rs-Lager)']].map(([l,c,b])=>`<span><i style="--c:${c};--b:${b}"></i>${l}</span>`).join('')}</div>
  <p class="hint" style="margin-top:-12px">${bs.length} von ${totalN} Betten${G!=='Alle'||N!=='Alle'?' · Filter nach Person zeigt nur belegte Betten':''}</p>

   ${rows.map((r,i)=>{const rm=x=>x.b.area+'|'+x.b.room.replace(/\.[^.]*$/,'');const grp=i&&rm(rows[i-1])===rm(r)?'same-room':'room-start';return `<tr class="${grp} ${r.al?'alert-row':'rs-'+r.b.status.split(' ')[0]}">${all?`<td>${esc(areaName(r.b.area))}</td>`:''}<td><b>${r.b.room}</b></td><td><span class="pill st-${r.b.status}">${r.b.status}</span></td><td class="num">${r.p?r.p.qmm:'–'}</td><td>${r.p?`<button type="button" class="linkish" style="white-space:nowrap" data-act="akte" data-q="${r.p.qmm}">${esc(r.p.name)} ${esc(r.p.vorname)}</button>`:`<span style="color:var(--muted)">${esc(r.b.note)||'–'}</span>`}</td><td>${r.p?esc(r.p.g):''}</td><td>${r.p?esc(r.p.nat):''}</td><td style="${r.pr.c}">${r.p?`<span class="pres">${quick(r.p)}<span>${esc(r.pr.t)}</span></span>`:''}</td><td><div class="actions" style="flex-wrap:nowrap">${r.act}</div></td></tr>`}).join('')||'<tr><td colspan="10" class="empty">Keine Betten für diesen Filter.</td></tr>'}
  </tbody></table></div>

function akteView(){
  const p=person(UI.akte); if(!p)return '<p class="empty">Person nicht gefunden.</p>';
  const d=daysAway(p);
  const seq=[]; for(let i=13;i>=0;i--){let c='d-a'; if(i<p.lastSeen&&S.att[p.qmm]!=='a')c='d-b'; if(i===0){c=S.att[p.qmm]==='a'?'d-a':S.att[p.qmm]==='b'?'d-b':S.att[p.qmm]==='c'?'d-c':(p.lastSeen>0?'d-b':'d-n')} if(new Date(p.since)>dAgo(i))c='d-n'; seq.push({c,n:dAgo(i).getDate()})}

   ${S.dsgvo.approved?`<button type="button" class="btn" data-act="edopen" data-q="${p.qmm}">Stammdaten bearbeiten</button>`:''}
   <button type="button" class="btn" data-act="auskunft" data-q="${p.qmm}">Datenauskunft (DSGVO)</button>

  <div class="two">

     <div class="legend" style="margin-top:8px"><span><i class="d-a"></i>Anwesend</span><span><i class="d-b"></i>Abwesend</span><span><i class="d-c"></i>Sonstiges</span><span><i class="d-n"></i>Keine Daten</span></div>
    </section>
    ${akteKkHTML(p)}

function hbars(items,max,fmtV){return `<div class="hbars">${items.map(([l,v,extra])=>`<div class="hb"><span>${esc(l)}</span><span class="tr"><i style="width:${max?Math.round(v/max*100):0}%"></i></span><b>${fmtV?fmtV(v,extra):v}</b></div>`).join('')||'<p class="empty">Noch keine Daten.</p>'}</div>`}
function periodLogs(days){const from=+dAgo(days);return S.log.filter(l=>l.t>=from&&logCamp(l)===S.camp)}
function attRateToday(){const ap=activePeople();const a=ap.filter(p=>S.att[p.qmm]==='a'||S.att[p.qmm]==='c').length;const done=ap.filter(p=>S.att[p.qmm]).length;return done?Math.round(a/done*100):null}

}
function reportPreview(type){
  const head=`<p class="hint">${esc(campName(S.camp))} · Stand ${today.toLocaleDateString('de-DE')} · erstellt von ${ME.name}</p>`;
  if(type==='Tagesbericht Anwesenheit'){
    const ap=activePeople(); const C=k=>ap.filter(p=>S.att[p.qmm]===k).length;
    const A=C('a'),B=C('b'),Cc=C('c'),O=ap.length-A-B-Cc,T=ap.length||1; const long=ap.filter(p=>daysAway(p)>3);
    // donut
    const segs=[[A,'var(--ok)','Anwesend'],[B,'var(--bad)','Abwesend'],[Cc,'var(--warn)','Sonstiges'],[O,'var(--line-2)','Offen']];
    let off=0; const R0=42, CIRC=2*Math.PI*R0;
    const arcs=segs.map(([v,c])=>{const len=v/T*CIRC;const el=`<circle cx="60" cy="60" r="${R0}" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${len} ${CIRC-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return v?el:''}).join('');
    const donut=`<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="Anwesend ${A}, abwesend ${B}, sonstiges ${Cc}, offen ${O}"><circle cx="60" cy="60" r="${R0}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>${arcs}<text x="60" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="var(--fg)">${Math.round(A/T*100)}%</text><text x="60" y="76" text-anchor="middle" font-size="10" fill="var(--muted)">anwesend</text></svg>`;
    const legend=`<div class="legend" style="flex-direction:column;gap:8px;font-size:14px">${segs.map(([v,c,l])=>`<span><i style="background:${c}"></i>${l}: <b style="font-variant-numeric:tabular-nums">${v}</b></span>`).join('')}</div>`;
    // stacked bars per building
    const stack=areasCur().map(a=>{const xp=activePeople(a.id);const t=xp.length||1;const c=k=>xp.filter(p=>S.att[p.qmm]===k).length;const a1=c('a'),b1=c('b'),c1=c('c'),o1=xp.length-a1-b1-c1;
      return `<div class="hb" style="grid-template-columns:56px 1fr 46px"><span><b>${esc(a.name)}</b></span><span style="display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-2)">${[[a1,'var(--ok)'],[b1,'var(--bad)'],[c1,'var(--warn)'],[o1,'var(--line-2)']].map(([v,col])=>v?`<i style="width:${v/t*100}%;background:${col}"></i>`:'').join('')}</span><b>${xp.length?Math.round(a1/t*100):0}%</b></div>`}).join('');
    // 7-day trend
    const tr=[];for(let i=6;i>=1;i--){const d=dAgo(i);tr.push({n:d.toLocaleDateString('de-DE',{weekday:'short'}),v:S.camp==='c1'?S.attHist[iso(d)]:null})}
    const done=A+B+Cc; tr.push({n:'heute',v:done?Math.round((A+Cc)/done*100):null});
    const pts=tr.map((x,i)=>x.v==null?null:[20+i*(260/6),100-(x.v-60)/40*80]);
    const line=pts.filter(Boolean).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const trend=pts.some(Boolean)?`<svg viewBox="0 0 300 130" width="100%" style="max-width:420px" role="img" aria-label="Anwesenheitsquote der letzten 7 Tage">${[60,80,100].map(g=>`<line x1="20" x2="280" y1="${100-(g-60)/40*80}" y2="${100-(g-60)/40*80}" stroke="var(--line)"/><text x="16" y="${104-(g-60)/40*80}" text-anchor="end" font-size="9" fill="var(--muted)">${g}</text>`).join('')}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="${i===6?5:3.5}" fill="${i===6?'var(--accent-strong)':'var(--accent)'}"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--fg)">${tr[i].v}</text>`:'').join('')}${tr.map((x,i)=>`<text x="${20+i*(260/6)}" y="122" text-anchor="middle" font-size="9" fill="var(--muted)">${x.n}</text>`).join('')}</svg>`:'<p class="hint">Noch keine Verlaufsdaten.</p>';
    const rows=areasCur().map(a=>{const xp=activePeople(a.id);const c=k=>xp.filter(p=>S.att[p.qmm]===k).length;return `<tr><td>${esc(a.name)}</td><td>${xp.length}</td><td>${c('a')}</td><td>${c('b')}</td><td>${c('c')}</td><td>${xp.filter(p=>daysAway(p)>3).length}</td></tr>`}).join('');
    return head+`
    <div class="stat3"><div class="card kpi"><span class="l">Bewohner</span><span class="v">${ap.length}</span></div><div class="card kpi"><span class="l">Kontrolliert</span><span class="v">${done}</span><span class="s" style="color:var(--muted)">${Math.round(done/T*100)} %</span></div><div class="card kpi ${long.length?'alert':''}"><span class="l">&gt; 3 Tage abwesend</span><span class="v">${long.length}</span></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center"><div style="flex:none">${donut}</div>${legend}</div>
    <h3 style="font-size:16px">Anwesenheit je Gebäude</h3><div class="hbars">${stack}</div>
    <h3 style="font-size:16px">Verlauf · 7 Tage (Anwesenheitsquote in %)</h3>${trend}
    ${long.length?`<h3 style="font-size:16px">Länger als 3 Tage abwesend</h3><div class="table-wrap"><table class="rep-table"><tr><th>Name</th><th>QMM</th><th>Zimmer</th><th>Tage</th></tr>${long.sort((x,y)=>daysAway(y)-daysAway(x)).map(p=>`<tr><td>${esc(p.name)} ${esc(p.vorname)}</td><td>${p.qmm}</td><td>${bedLabel(S.beds,p.bed)}</td><td><b style="color:var(--bad)">${daysAway(p)}</b></td></tr>`).join('')}</table></div>`:''}
    <h3 style="font-size:16px">Übersicht</h3><div class="table-wrap"><table class="rep-table"><tr><th>Gebäude</th><th>Bewohner</th><th>Anwesend</th><th>Abwesend</th><th>Sonstiges</th><th>&gt; 3 Tage</th></tr>${rows}</table></div>`}
  if(type==='Wochenbericht Belegung'){return head+`<div class="table-wrap"><table class="rep-table"><tr><th>Gebäude</th><th>Betten</th><th>Belegt</th><th>Frei</th><th>Reinigen</th><th>Gesperrt</th></tr>${areasCur().map(a=>{const s=stats(a.id);return `<tr><td>${esc(a.name)}</td><td>${s.total}</td><td>${s.belegt}</td><td>${s.frei}</td><td>${s.rein}</td><td>${s.gesp}</td></tr>`}).join('')}</table></div>`}
  if(type==='Bewegungsprotokoll'){const L=periodLogs(7).sort((a,b)=>b.t-a.t).slice(0,12);return head+`<div class="table-wrap"><table class="rep-table"><tr><th>Zeit</th><th>Art</th><th>Vorgang</th></tr>${L.map(l=>`<tr><td>${fmtT(l.t)}</td><td>${l.type}</td><td>${esc(l.text)}</td></tr>`).join('')}</table></div><p class="hint">Auszug: die letzten 12 Einträge der letzten 7 Tage.</p>`}
  const D=S.defects.filter(d=>campOf(d.area)===S.camp);return head+`<div class="table-wrap"><table class="rep-table"><tr><th>Ort</th><th>Kategorie</th><th>Dringlichkeit</th><th>Status</th></tr>${D.map(d=>`<tr><td>${esc(areaName(d.area))} · ${esc(d.place)}</td><td>${esc(d.cat)}</td><td>${d.prio}</td><td>${d.state}</td></tr>`).join('')}</table></div>`;
}

function impRun(){const I=UI.imp,R=I.r,cid=UI.admCamp||S.camp;const out={na:0,nr:0,nb:0,np:0,up:0,skip:0};
  if(I.mode==='replace'){const ids=S.areas.filter(a=>a.camp===cid).map(a=>a.id);S.beds=S.beds.filter(b=>!ids.includes(b.area));S.areas=S.areas.filter(a=>a.camp!==cid)}
  const byName={};S.areas.filter(a=>a.camp===cid).forEach(a=>byName[a.name.toLowerCase()]=a);
  R.rows.forEach(r=>{let a=byName[r.an.toLowerCase()];if(!a){a={id:'a'+(S.nextId++),camp:cid,name:r.an,rooms:[]};S.areas.push(a);byName[r.an.toLowerCase()]=a;out.na++}
    const bn=r.bn.includes('.')?r.bn:r.bn+'.1';const room=bn.replace(/\.[^.]*$/,'');if(!a.rooms.includes(room)){a.rooms.push(room);out.nr++}
    let b=S.beds.find(x=>x.area===a.id&&x.room===bn);
    if(!b){b={id:a.id+'|'+bn,area:a.id,room:bn,status:r.st,qmm:null,note:''};S.beds.push(b);out.nb++}
    else if(!b.qmm&&b.status!==r.st){b.status=r.st;out.up++}
    if(I.withRes&&r.res){const p0=S.people[r.res.qmm];if(b.qmm&&b.qmm!==r.res.qmm||(p0&&p0.active&&p0.bed!==b.id)){out.skip++;return}
      S.people[r.res.qmm]=Object.assign(p0||{},r.res,{active:true,bed:b.id,since:(p0&&p0.since)||iso(today),lastSeen:0});b.qmm=r.res.qmm;b.status='Belegt';out.np++}});
  S.areas.filter(a=>a.camp===cid).forEach(a=>a.rooms.sort((x,y)=>x.localeCompare(y,'de',{numeric:true})));
  addLog('IMPORT',null,'Import „'+I.file+'“: '+out.nr+' Zimmer, '+out.nb+' Betten'+(I.withRes?', '+out.np+' Bewohner':''));S.log[S.log.length-1].camp=cid;
  if(!UI.area||!S.areas.some(a=>a.id===UI.area&&a.camp===S.camp))UI.area=(areasCur()[0]||{}).id;if(!S.areas.some(a=>a.id===UI.attArea&&a.camp===S.camp))UI.attArea=(areasCur()[0]||{}).id;
  UI.rm=null;I.out=out;I.step='done';save();render();impRedraw()}

function saveEdit(q){const p=person(q);const v=k=>(document.getElementById('ed-'+k).value||'').trim();const nq=v('qmm');

  const next={qmm:nq,name:v('name'),vorname:v('vorname'),geb:v('geb'),g:v('g'),nat:v('nat'),lang:v('lang')};
  const L={qmm:'QMM',name:'Name',vorname:'Vorname',geb:'Geburtsdatum',g:'Geschlecht',nat:'Nationalität',lang:'Sprache'};

function protokollView(){const P=UI.pr||(UI.pr={q:'',typ:'',wer:'',von:'',bis:'',page:1});const q=P.q.trim().toLowerCase();
  let L=S.log.filter(l=>logCamp(l)===S.camp).sort((a,b)=>b.t-a.t);const people=[...new Set(L.map(l=>l.by))].sort();
  if(P.typ)L=L.filter(l=>l.type===P.typ);if(P.wer)L=L.filter(l=>l.by===P.wer);
  if(P.von)L=L.filter(l=>l.t>=+new Date(P.von+'T00:00:00'));if(P.bis)L=L.filter(l=>l.t<=+new Date(P.bis+'T23:59:59'));
  if(q)L=L.filter(l=>l.text.toLowerCase().includes(q)||(l.qmm||'').includes(q));

const KK_CATS=['Oberteile','Hosen','Jacken','Unterwäsche','Socken','Schuhe','Kinder','Hygiene','Bettwäsche','Sonstiges'];
const KK_STARTER=[['Oberteile','T-Shirt',['S','M','L','XL','XXL']],['Oberteile','Pullover',['S','M','L','XL','XXL']],['Hosen','Hose',['S','M','L','XL','XXL']],['Hosen','Jogginghose',['S','M','L','XL']],['Jacken','Winterjacke',['S','M','L','XL','XXL']],['Unterwäsche','Unterhose',['S','M','L','XL']],['Socken','Socken (Paar)',['39–42','43–46']],['Schuhe','Schuhe',['38','39','40','41','42','43','44','45']],['Kinder','Kinderkleidung-Set',['98–110','116–128','134–146']],['Hygiene','Hygieneset',['']],['Bettwäsche','Bettwäsche-Set',['']],['Bettwäsche','Handtuch',['']]];
const KK_WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const kkMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const kkTime=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function kkSlots(){const s=S.kk.set,o=[];s.blocks.forEach(([a,b])=>{for(let m=kkMin(a);m+s.slot<=kkMin(b);m+=s.slot)o.push(kkTime(m))});return o}
function kkWeekday(d){const w=new Date(d+'T12:00:00').getDay();return w===0?7:w}
function kkAddDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)}
function kkDiff(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5)}
function kkItemLabel(i){return i.name+(i.size?' '+i.size:'')}
function kkSeed(){const items=[];let n=1,sd=11;const r=()=>((sd=(sd*1664525+1013904223)%4294967296)/4294967296);
  KK_STARTER.forEach(([cat,name,sizes])=>sizes.forEach(size=>{const q=10+Math.floor(r()*40);items.push({id:'k'+(n++),cat,name,size,stock:q,min:5,inn:q,out:0})}));
  const kk={set:{interval:75,max:30,slot:15,per:2,blocks:[['09:30','11:30'],['13:30','15:30']],days:[1,2,3,4,5]},items,appts:[],next:1};
  const ppl=Object.values(S.people).filter(p=>p.active);const slots=['09:30','09:45','10:00','10:15','10:30','10:45','11:00','11:15','13:30','13:45','14:00','14:15','14:30','14:45','15:00','15:15'];let k=0;
  for(let d=14;d>=1;d--){const day=iso(dAgo(d));if(kkWeekday(day)>5)continue;for(let j=0;j<4+Math.floor(r()*5)&&k<Math.min(70,ppl.length);j++,k++){const p=ppl[k];const lines=[];for(let x=0;x<2+Math.floor(r()*3);x++){const it=items[Math.floor(r()*items.length)];if(it.stock<1)continue;const l=lines.find(y=>y.item===it.id);if(l)l.qty++;else lines.push({item:it.id,qty:1});it.stock--;it.out++}
    kk.appts.push({id:'t'+(kk.next++),camp:'c1',qmm:p.qmm,date:day,time:slots[j%16],status:'ausgegeben',notfall:false,notfallBy:'',reason:'',note:'',by:'Testdaten',created:+new Date(day+'T08:00:00'),issuedAt:+new Date(day+'T10:00:00'),issuedBy:'Testdaten',lines})}}
  for(let d=0;d<=3;d++){const day=iso(dAgo(-d));if(kkWeekday(day)>5)continue;for(let j=0;j<(d===0?10:5);j++,k++){const p=ppl[k%ppl.length];if(!p||kk.appts.some(a=>a.qmm===p.qmm&&a.status==='geplant'))continue;kk.appts.push({id:'t'+(kk.next++),camp:'c1',qmm:p.qmm,date:day,time:slots[Math.floor(j/2)],status:'geplant',notfall:false,notfallBy:'',reason:'',note:'',by:'Testdaten',created:Date.now(),issuedAt:null,issuedBy:'',lines:[]})}}
  return kk}
function kkCampAppts(){return S.kk.appts.filter(a=>(a.camp||'c1')===S.camp)}
function kkLast(qmm){const a=S.kk.appts.filter(x=>x.qmm===qmm&&x.status==='ausgegeben').sort((x,y)=>y.issuedAt-x.issuedAt)[0];return a?iso(a.issuedAt):null}
function kkEnt(qmm,day){const l=kkLast(qmm);if(!l)return {ok:true,last:null,from:null,since:null};const since=kkDiff(day,l);return since>=S.kk.set.interval?{ok:true,last:l,from:null,since}:{ok:false,last:l,from:kkAddDays(l,S.kk.set.interval),since}}
function kkPlan(day){const s=S.kk.set;const taken=kkCampAppts().filter(a=>a.date===day&&a.status!=='abgesagt');const full=taken.length>=s.max;const nowT=pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  return {open:s.days.includes(kkWeekday(day)),booked:taken.length,plan:kkSlots().map(t=>{const used=taken.filter(a=>a.time===t).length;const past=day===iso(today)&&t<=nowT;return {t,used,past,free:past||full?0:Math.max(0,s.per-used)}})}}
function kkStatusPill(st){const c={geplant:'info',ausgegeben:'ok',abgesagt:'st-Lager','nicht erschienen':'warn'}[st];return `<span class="pill ${c}">${st}</span>`}

  </section></div>`}

   ${Object.keys(tot).length?`<h3 style="font-size:16px">Tagesbericht: ausgegebene Artikel</h3><div class="table-wrap"><table class="rep-table"><tr><th>Artikel</th><th style="text-align:right">Menge</th></tr>${Object.entries(tot).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right"><b>${v}</b></td></tr>`).join('')}<tr><td><b>Gesamt</b></td><td style="text-align:right"><b>${Object.values(tot).reduce((a,b)=>a+b,0)}</b></td></tr></table></div>`:''}

function kkCsv(){const K=UI.kk;const byId=id=>S.kk.items.find(i=>i.id===id);const rows=[['Datum','Uhrzeit','QMM','Name','Vorname','Artikel','Größe','Menge','Notfall','Ausgegeben von']];
  kkCampAppts().filter(a=>a.status==='ausgegeben'&&a.date>=K.von&&a.date<=K.bis).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(a=>{const p=person(a.qmm)||{name:'',vorname:''};a.lines.forEach(l=>{const i=byId(l.item);rows.push([a.date,a.time,a.qmm,p.name,p.vorname,i.name,i.size,l.qty,a.notfall?'ja':'',a.issuedBy])})});
  const cell=v=>{const s=String(v??'');return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};const u=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='kleiderkammer_'+K.von+'_'+K.bis+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('CSV-Datei heruntergeladen')}

function kkRefocus(id,fn){const el=document.getElementById(id);const pos=el?el.selectionStart:null;fn();render();const n=document.getElementById(id);if(n){n.focus();try{if(pos!==null)n.setSelectionRange(pos,pos)}catch(_){}}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-kk]');if(!t)return;const K=UI.kk,v=t.dataset.v,s=S.kk.set;
  switch(t.dataset.kk){
   case 'tab':K.tab=v;if(v==='neu'){K.notfall=false;K.reason=''}if(v!=='termin')K.lines=[];if(UI.view!=='kleiderkammer'){go('kleiderkammer');return}render();window.scrollTo(0,0);break;
   case 'mon':{const [y,m]=K.month.split('-').map(Number);const d=new Date(y,m-1+Number(v),1);K.month=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break}
   case 'day':K.day=v;render();break;
   case 'newday':K.date=K.day<iso(today)?iso(today):K.day;K.tab='neu';K.notfall=false;K.reason='';render();break;
   case 'tagesliste':kkTagesliste();break;
   case 'open':K.appt=v;K.tab='termin';K.lines=[];closeSheet();if(UI.view!=='kleiderkammer'){go('kleiderkammer');return}render();window.scrollTo(0,0);break;
   case 'time':K.time=v;render();break;
   case 'book':{const p=person(K.qmm.trim());const e=kkEnt(p.qmm,K.date);const pl=kkPlan(K.date);const sl=pl.plan.find(x=>x.t===K.time);if(!sl||sl.free<=0){toast('Dieses Zeitfenster ist nicht mehr frei');render();break}
     if(!e.ok&&!(K.notfall&&K.reason.trim())){toast('Kein Anspruch – nur als Notfall mit Begründung');break}
     const nf=!e.ok;const a={id:'t'+(S.kk.next++),camp:S.camp,qmm:p.qmm,date:K.date,time:K.time,status:'geplant',notfall:nf,notfallBy:nf?ME.name:'',reason:nf?K.reason.trim():'',note:K.note.trim(),by:ME.name,created:Date.now(),issuedAt:null,issuedBy:'',lines:[]};S.kk.appts.push(a);
     addLog('KLEIDERKAMMER',p.qmm,'Termin '+fmt(K.date)+' '+K.time+' Uhr'+(nf?' · NOTFALL ('+a.reason+')':''));save();toast('Termin am '+fmt(K.date)+' um '+K.time+' Uhr gespeichert');K.qmm='';K.note='';K.notfall=false;K.reason='';K.appt=a.id;K.tab='termin';K.lines=[];render();window.scrollTo(0,0);break}
   case 'addline':{const q=Math.max(1,Math.floor(Number(K.iqty)||1));const i=S.kk.items.find(x=>x.id===K.iid);if(!i)break;const used=K.lines.filter(l=>l.item===i.id).reduce((n,l)=>n+l.qty,0);if(i.stock-used<q){toast('Nicht genug auf Lager (noch '+(i.stock-used)+')');break}
     const l=K.lines.find(x=>x.item===i.id);if(l)l.qty+=q;else K.lines.push({item:i.id,qty:q});K.iqty='1';render();break}
   case 'delline':K.lines=K.lines.filter(l=>l.item!==v);render();break;
   case 'issue':{const a=S.kk.appts.find(x=>x.id===K.appt);if(!a||a.status!=='geplant'||!K.lines.length)break;for(const l of K.lines){const i=S.kk.items.find(x=>x.id===l.item);if(i.stock<l.qty){toast('Nicht genug auf Lager: '+kkItemLabel(i));return}}

/* ---------- sheets ---------- */
function openSheet(html){document.getElementById('sheet-root').innerHTML=`<div class="scrim" data-act="closeScrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=document.querySelector('.sheet button, .sheet select');if(f)f.focus()}
function closeSheet(){document.getElementById('sheet-root').innerHTML=''}
let MV={};
function moveSheet(q){const p=person(q);MV={q,area:MV.q===q?MV.area:bed(p.bed).area,bed:null};drawMove()}

  openSheet(`<div class="sheet-h"><div><h2>Umbuchung</h2><p class="hint">${esc(p.name)} ${esc(p.vorname)} · QMM ${p.qmm} · aktuell ${bedLabel(S.beds,p.bed)}</p></div><button type="button" class="x" data-act="close" aria-label="Schließen">${IC.x}</button></div>

  <label class="f">Bemerkung<input id="mv-note" type="text" placeholder="z. B. Familienzusammenführung"></label>

function outSheet(q){const p=person(q);openSheet(`<div class="sheet-h"><div><h2>Auszug erfassen</h2><p class="hint">${esc(p.name)} ${esc(p.vorname)} · ${bedLabel(S.beds,p.bed)}</p></div><button type="button" class="x" data-act="close" aria-label="Schließen">${IC.x}</button></div>

   case 'thSet':{const x=S.things.find(y=>y.id==t.dataset.id);x.state=t.dataset.s;addLog('SACHEN',x.qmm,'Sachen '+x.state+': '+x.items);save();render();toast('Als „'+x.state+'“ markiert');break}
   case 'thAdd':{const N=UI.thNew;if(!N.name.trim()||!N.items.trim()){toast('Bitte Name und Sachen angeben');break}const ar=areasCur()[0];S.things.push({id:S.nextId++,name:N.name.trim(),qmm:'',area:ar?ar.id:'',room:N.room.trim()||'–',reason:N.reason,items:N.items.trim(),store:N.store||('Lager '+(ar?ar.name:'')),t:Date.now(),state:'eingelagert',photo:N.photo||null,camp:S.camp});UI.thNew=null;UI.thF='eingelagert';save();render();toast('Sachen eingelagert');break}
   case 'attOpen':UI.attArea=t.dataset.area;UI.attFilter='alle';go('anwesenheit');break;
   case 'repto':{const m=t.dataset.m;const cur=UI.rep.to.split(',').map(x=>x.trim()).filter(Boolean);if(!cur.includes(m))cur.push(m);UI.rep.to=cur.join(', ');render();break}
   case 'repprev':openSheet(`<div class="sheet-h"><div><h2>${esc(UI.rep.type)}</h2><p class="hint">Vorschau · ${esc(UI.rep.fmt)}</p></div><button type="button" class="x no-print" data-act="close" aria-label="Schließen">${IC.x}</button></div>${reportPreview(UI.rep.type)}<button type="button" class="btn no-print" style="align-self:flex-start" data-act="printsheet">Drucken / als PDF speichern</button>`);break;
   case 'repsend':{const R=UI.rep;S.reports.push({id:S.nextId++,type:R.type,to:R.to,plan:R.plan,fmt:R.fmt,t:Date.now(),camp:S.camp});save();render();toast(R.plan.startsWith('Einmalig')?'Bericht gesendet (Demo)':'Versand geplant: '+R.plan);break}
   case 'repstop':{S.reports=S.reports.filter(x=>x.id!=t.dataset.id);save();render();toast('Geplanter Versand gestoppt');break}
   case 'admpick':UI.admCamp=t.dataset.c;UI.adm=null;render();break;
   case 'campgo':S.camp=t.dataset.c;save();go('uebersicht');toast('Einrichtung: '+campName(S.camp));break;
   case 'addcamp':{const n=(UI.admC||'').trim();if(!n){toast('Bitte einen Namen angeben');break}const id='c'+(S.nextId++);S.camps.push({id,name:n,ort:(UI.admO||'').trim()});UI.admCamp=id;UI.admC='';UI.admO='';UI.adm=null;save();render();toast('Einrichtung „'+n+'“ angelegt – jetzt Gebäude hinzufügen');break}
   case 'addarea':{const n=(UI.admA||'').trim();if(!n){toast('Bitte einen Gebäudenamen angeben');break}if(S.areas.some(a=>a.camp===UI.admCamp&&a.name.toLowerCase()===n.toLowerCase())){toast('Dieses Gebäude gibt es schon');break}const id='a'+(S.nextId++);S.areas.push({id,camp:UI.admCamp,name:n,rooms:[]});UI.admA='';if(UI.adm)UI.adm.area=id;save();render();toast('Gebäude „'+n+'“ angelegt');break}
   case 'addrooms':{const F=UI.adm;const a=S.areas.find(x=>x.id===F.area);const from=parseInt(F.from,10),to=parseInt(F.to,10),bpr=parseInt(F.beds,10);let nr=0,nb=0;
      for(let i=from;i<=to;i++){const rn=F.prefix+(F.prefix?pad(i):String(i));if(a.rooms.includes(rn))continue;a.rooms.push(rn);nr++;for(let k=1;k<=bpr;k++){S.beds.push({id:a.id+'|'+rn+'.'+k,area:a.id,room:rn+'.'+k,status:'Frei',qmm:null,note:''});nb++}}
      addLog('ZIMMER',null,a.name+': '+nr+' Zimmer mit '+nb+' Betten angelegt');S.log[S.log.length-1].camp=a.camp;save();render();toast(nr?nr+' Zimmer · '+nb+' Betten angelegt':'Alle Zimmer gab es schon');break}
   case 'roomEdit':UI.rmE={area:t.dataset.area,room:t.dataset.room,name:t.dataset.room,note:'',confirm:false};openSheet(roomSheet());break;
   case 'bedAdd':case 'bedDel':case 'roomLock':case 'roomRename':case 'roomDel':case 'roomDelNo':roomAction(a,t);break;
   case 'areaEdit':{const x=S.areas.find(y=>y.id===t.dataset.area);UI.arE={id:x.id,name:x.name,confirm:false};openSheet(areaSheet());break}
   case 'areaRename':case 'areaDel':case 'areaDelNo':areaAction(a,t);break;
   case 'impTpl':impTemplate();break;
   case 'impRun':impRun();break;
   case 'bfreset':UI.q='';UI.stFilter='Alle';UI.gFilter='Alle';UI.nFilter='Alle';render();break;
   case 'edopen':editSheet(t.dataset.q);break;
   case 'edsave':saveEdit(t.dataset.q);break;
   case 'auskunft':openSheet(auskunftHTML(person(t.dataset.q)));addLog('DATENSCHUTZ',t.dataset.q,'Datenauskunft erstellt');save();break;
   case 'anonopen':anonSheet(t.dataset.q);break;
   case 'anondo':{if((document.getElementById('anon-c').value||'').trim().toUpperCase()!=='LÖSCHEN'){toast('Bitte LÖSCHEN eingeben');break}const k=anonymize(t.dataset.q);addLog('DATENSCHUTZ',null,'Personenbezogene Daten auf Antrag gelöscht (anonymisiert)');save();closeSheet();UI.akte=k;render();toast('Daten gelöscht – die Akte ist jetzt anonym');break}
   case 'dsgvoOn':{if((document.getElementById('dsgvo-c').value||'').trim().toUpperCase()!=='FREIGEBEN'){toast('Bitte FREIGEBEN eingeben');break}S.dsgvo={approved:true,by:ME.name,at:Date.now()};addLog('DATENSCHUTZ',null,'Verarbeitung von Bewohnerdaten freigegeben');save();render();toast('Bewohnerdaten freigegeben');break}
   case 'dsgvoOff':{if(!confirm('Freigabe wirklich zurücknehmen? Neuaufnahme und Import werden gesperrt.'))break;S.dsgvo={approved:false,by:ME.name,at:Date.now()};addLog('DATENSCHUTZ',null,'Freigabe für Bewohnerdaten zurückgenommen');save();render();toast('Freigabe zurückgenommen');break}
   case 'retrun':{const due=retentionDue();if(!due.length||!confirm(due.length+' Personen jetzt endgültig anonymisieren?'))break;due.forEach(p=>anonymize(p.qmm));addLog('DATENSCHUTZ',null,due.length+' Personen nach Ablauf der Löschfrist anonymisiert');save();render();toast(due.length+' Personen anonymisiert');break}
   case 'uadd':{const n=(document.getElementById('u-name').value||'').trim(),m=(document.getElementById('u-mail').value||'').trim().toLowerCase(),r=document.getElementById('u-role').value;if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){toast('Bitte Name und gültige E-Mail angeben');break}if(S.users.some(u=>u.email===m)){toast('Diese E-Mail ist bereits angelegt');break}S.users.push({id:'u'+(S.nextId++),name:n,email:m,role:r,active:true});save();render();toast('Benutzer gespeichert');break}
   case 'csv':downloadCsv(t.dataset.t);break;
   case 'prpage':UI.pr.page=+t.dataset.p;render();break;
   case 'prreset':UI.pr=null;render();break;
   case 'close':case 'closeScrim':closeSheet();break;
  }
});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='rm-q'){UI.rm.q=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('rm-q');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
  if(id==='rm-name'&&UI.rmE)UI.rmE.name=e.target.value;
  if(id==='rm-note'&&UI.rmE)UI.rmE.note=e.target.value;
  if(id==='ar-name'&&UI.arE)UI.arE.name=e.target.value;
  if(id==='pr-q'){UI.pr.q=e.target.value;UI.pr.page=1;const pos=e.target.selectionStart;render();const el=document.getElementById('pr-q');el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
  if(id==='bq'){UI.q=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('bq');el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
  if(id&&id.startsWith('na-')&&e.target.tagName==='INPUT'&&e.target.type==='text'){UI.na[id.slice(3)]=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById(id);el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
  if(id==='t-text'){UI.tech.text=e.target.value;const btn=document.querySelector('[data-act="tsave"]');if(btn)btn.disabled=!(UI.tech.place&&UI.tech.text.trim())}
  if(id==='rep-to'){UI.rep.to=e.target.value;const btn=document.querySelector('[data-act="repsend"]');if(btn)btn.disabled=!UI.rep.to.trim()}
  if(id==='inc-q'){UI.inc.q=e.target.value;incRedraw('inc-q')}
  else if(e.target.dataset&&e.target.dataset.k&&UI.inc&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT'){UI.inc.vals[e.target.dataset.k]=e.target.value}
  if(id==='th-name')UI.thNew.name=e.target.value;
  if(id==='th-items')UI.thNew.items=e.target.value;
  if(id==='th-room')UI.thNew.room=e.target.value;
  if(id==='adm-cname')UI.admC=e.target.value;
  if(id==='adm-cort')UI.admO=e.target.value;
  if(id==='adm-aname')UI.admA=e.target.value;
  if(['adm-prefix','adm-from','adm-to','adm-beds'].includes(id)){UI.adm[id.slice(4)]=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById(id);el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='rm-area'){UI.rm={area:e.target.value,q:''};render()}
  if(id==='imp-file'&&e.target.files[0]){impFile(e.target.files[0]);e.target.value=''}
  if(e.target.name==='imp-mode'){UI.imp.mode=e.target.value}
  if(id==='imp-res'){UI.imp.withRes=e.target.checked;if(!UI.imp.withRes)UI.imp.dsgvo=false;impRedraw()}
  if(id==='imp-dsgvo'){UI.imp.dsgvo=e.target.checked;impRedraw()}
  if(id==='bst'){UI.stFilter=e.target.value;render()}
  if(id==='bg'){UI.gFilter=e.target.value;render()}
  if(id==='bn'){UI.nFilter=e.target.value;render()}
  if(id==='ag'){UI.attG=e.target.value;render()}
  if(id==='an'){UI.attN=e.target.value;render()}
  if(id==='ret-m'){S.retention=+e.target.value;addLog('DATENSCHUTZ',null,S.retention?'Löschfrist auf '+S.retention+' Monate nach Auszug gesetzt':'Automatische Löschung ausgeschaltet');save();render();toast(S.retention?'Löschfrist: '+S.retention+' Monate':'Automatische Löschung ausgeschaltet')}
  if(e.target.dataset&&e.target.dataset.urole){const u=S.users.find(x=>x.id===e.target.dataset.urole);u.role=e.target.value;save();toast('Rolle gespeichert')}
  if(e.target.dataset&&e.target.dataset.uact){const u=S.users.find(x=>x.id===e.target.dataset.uact);u.active=e.target.checked;save();toast(u.active?'Konto aktiviert':'Konto gesperrt')}
  if(['pr-typ','pr-wer','pr-von','pr-bis'].includes(id)){UI.pr[id.slice(3)]=e.target.value;UI.pr.page=1;render()}
  if(id==='mv-area'){MV.area=e.target.value;MV.bed=null;drawMove()}
  if(id&&id.startsWith('na-')&&e.target.type!=='text'){UI.na[id.slice(3)]=e.target.value;if(id==='na-area')UI.na.bed=null;render()}
  if(id==='t-area'){UI.tech.area=e.target.value;UI.tech.place='';render()}
  if(id==='t-place'){UI.tech.place=e.target.value;render()}
  if(id==='t-lock'){UI.tech.lock=e.target.checked}
  if(id==='t-text'){UI.tech.text=e.target.value;render()}
  if(id==='out-has'){const box=document.getElementById('out-things');if(box)box.hidden=!e.target.checked}
  if(id==='out-photo'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{UI.outPhoto=fr.result};fr.readAsDataURL(e.target.files[0])}
  if(id==='th-reason'){UI.thNew.reason=e.target.value}
  if(id==='inc-tpl'){UI.inc.tpl=e.target.value;UI.inc.vals={};{const tt=S.templates.find(x=>x.id===UI.inc.tpl);if(tt.noRes)UI.inc.resList=[];else if(!tt.multi)UI.inc.resList=UI.inc.resList.slice(0,1);UI.inc.vals={melder:ME.name}}incRedraw()}
  if(id==='inc-when'&&e.target.value){UI.inc.when=+new Date(e.target.value);if(!UI.inc.shiftManual)UI.inc.shift=shiftAt(UI.inc.when);incRedraw()}
  if(id==='inc-shift'){UI.inc.shift=e.target.value;UI.inc.shiftManual=UI.inc.shift!==shiftAt(UI.inc.when);incRedraw()}
  if(e.target.dataset&&e.target.dataset.k&&UI.inc&&e.target.tagName==='SELECT'){UI.inc.vals[e.target.dataset.k]=e.target.value}
  if(e.target.type==='checkbox'&&e.target.dataset.o&&UI.inc){const k=e.target.dataset.k;const a=new Set(UI.inc.vals[k]||[]);e.target.checked?a.add(e.target.dataset.o):a.delete(e.target.dataset.o);UI.inc.vals[k]=[...a]}
  if(id==='tpl-up'&&e.target.files[0]){const f=e.target.files[0];S.templates.push({id:'u'+(S.nextId++),name:f.name.replace(/\.[^.]+$/,''),desc:'Hochgeladene Vorlage',kind:'file',file:f.name});save();render();toast('Vorlage hinzugefügt')}
  if(id==='th-store'){UI.thNew.store=e.target.value}
  if(id==='th-photo'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{UI.thNew.photo=fr.result;render()};fr.readAsDataURL(e.target.files[0])}
  if(id==='camp-side'||id==='camp-top'){S.camp=e.target.value;save();render();toast('Einrichtung: '+campName(S.camp))}
  if(id==='rep-type'){UI.rep.type=e.target.value}
  if(id==='rep-plan'){UI.rep.plan=e.target.value;render()}
  if(id==='rep-fmt'){UI.rep.fmt=e.target.value;render()}
  if(id==='adm-area'){UI.adm.area=e.target.value;render()}
  if(id==='t-photo'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{UI.tech.photo=fr.result;render()};fr.readAsDataURL(e.target.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.scrim'))closeSheet()});
function setNet(off){S.offline=off;if(!off&&S.queue.length){const n=S.queue.length;S.queue=[];addLog('KONTROLLE',null,n+' Offline-Einträge übertragen');save();render();toast('Wieder online – '+n+' Einträge übertragen');return}save();render();toast(off?'Offline – Einträge werden auf dem Gerät gespeichert':'Wieder online')}
window.addEventListener('offline',()=>setNet(true));
window.addEventListener('online',()=>setNet(false));
window.addEventListener('hashchange',route);
demoDefaults();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!S.templates)S.templates=seedTemplates();
if(!S.incidents)S.incidents=seedIncidents();
route();
})();
</script>
